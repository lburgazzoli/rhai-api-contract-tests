name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"

      - name: Install pinned tools
        run: |
          GOBIN="$PWD/bin" go install github.com/oasdiff/oasdiff@v1.33.0
          GOBIN="$PWD/bin" go install github.com/mikefarah/yq/v4@v4.45.1

      - name: Build and test the Swagger 2.0 converter
        run: |
          go vet -C cmd/swagger2openapi ./...
          go test -C cmd/swagger2openapi ./...
          go build -C cmd/swagger2openapi -o "$PWD/bin/swagger2openapi" .

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Build and test the ECMAScript pattern validator
        run: |
          go vet -C cmd/openapi-validate ./...
          go test -C cmd/openapi-validate ./...
          go build -C cmd/openapi-validate -o "$PWD/bin/openapi-validate" .

      - name: Type-check
        run: |
          # Each module directory has its own checker.py, which mypy cannot check in one run.
          failed=0
          for file in cmd/contract-tests/cli.py cmd/release-baseline/release_baseline.py cmd/workflow-steps/steps.py modules/*/*.py; do
            python3 -m mypy "$file" || failed=1
          done
          exit "$failed"

      - name: Run tests
        env:
          OASDIFF: ${{ github.workspace }}/bin/oasdiff
          YQ: ${{ github.workspace }}/bin/yq
          SWAGGER2OPENAPI: ${{ github.workspace }}/bin/swagger2openapi
          OPENAPI_VALIDATE: ${{ github.workspace }}/bin/openapi-validate
        run: |
          python3 -m compileall cmd modules
          # The manifest_renderers group needs a prepared Go tool cache and is
          # selected by the dedicated manifest-renderers job below; pytest.ini
          # registers the marker and excludes it by default.
          python3 -m pytest modules/openapi-compat/tests modules/crd-compat/tests modules/coverage/tests cmd/action-pins/tests cmd/workflow-steps/tests cmd/release-baseline/tests modules/manifest-compat/tests -m "not manifest_renderers" -v

  # Real-renderer integration group: invokes the pinned go-run helm and
  # kustomize modules exactly as production. Go 1.27 because the pinned
  # Kustomize module requires it (the jobs above keep Go 1.26).
  manifest-renderers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.27"

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      # The only network-enabled step: fetch and verify the pinned renderer
      # modules into a cache outside the checkout and prime their compilation.
      - name: Prepare renderer tool cache
        run: python3 cmd/contract-tests/cli.py manifest-prepare --repo . --manifest-set selftest/manifests.yaml --tool-cache-dir "${RUNNER_TEMP}/manifest-tool-cache"

      # Rendering inside manifest-check is offline by process-level controls,
      # not by OS enforcement: every render subprocess runs with an
      # allowlisted environment, its module proxy pointed at the prepared
      # cache (which can only serve what preparation fetched and verified),
      # its working directory isolated, and every kustomization reference —
      # including nested plugin configurations — validated against the
      # repository snapshot before any subprocess starts. No network
      # namespace or sandbox is used, so this group reuses only the cache
      # prepared above; a missing or unprepared cache fails the tests
      # instead of skipping them.
      - name: Run real-renderer integration tests
        env:
          MANIFEST_RENDERERS_CACHE: ${{ runner.temp }}/manifest-tool-cache
        run: python3 -m pytest modules/manifest-compat/tests/test_renderer_integration.py -m manifest_renderers -v


  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"

      - name: Install pinned actionlint
        run: GOBIN="$PWD/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # actionlint also runs the runner's shellcheck on every run: script.
      - name: Lint workflows
        run: bin/actionlint

      - name: Check action pins against their version comments
        run: python3 cmd/action-pins/check_action_pins.py
