apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
crds:
  - crds/*.yaml
configurations:
  - kustomize-config.yaml
openapi:
  path: openapi-definition.yaml
configMapGenerator:
  - name: prod-config
    envs:
      - config.env
patches:
  - path: replica-patch.yaml
