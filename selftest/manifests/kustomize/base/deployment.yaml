apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example.com/web:1.0
          env:
            - name: SHARED
              valueFrom:
                configMapKeyRef:
                  # kustomize rewrites this to the generated hash-suffixed name
                  name: shared
                  key: alpha
