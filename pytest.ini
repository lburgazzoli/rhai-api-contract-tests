[pytest]
# The manifest_renderers group invokes the real pinned go-run tools and needs a
# prepared tool cache; it is selected explicitly (CI manifest-renderers job or
# a local -m manifest_renderers run) and excluded from every ordinary
# invocation. A CLI -m argument overrides this default.
addopts = -m "not manifest_renderers"
markers =
    manifest_renderers: real pinned go-run renderer integration tests; require Go >= 1.27 on PATH and MANIFEST_RENDERERS_CACHE pointing at a cache prepared by `cli.py manifest-prepare`
